name: JURIST AI Continuous Integration

on:
  push:
    branches: [main, develop, backend, frontend, ml-service]
  pull_request:
    branches: [main, develop]

jobs:
  test-ml-service:
    name: NLP & Precedent Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ML Dependencies
        run: |
          cd ml-service
          pip install -r requirements.txt
      - name: Run Python ML/NLP Tests
        run: |
          cd ml-service
          python -m unittest discover -s tests -v
      - name: Run Model Evaluation
        run: |
          cd ml-service
          python app/evaluation/evaluate_models.py

  test-and-build-backend:
    name: Backend API Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install
      - name: Run Backend Unit & Integration Tests
        run: |
          cd backend
          npm test
      - name: Compile Backend TypeScript
        run: |
          cd backend
          npm run build

  build-frontend:
    name: Frontend React/Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install
      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build
